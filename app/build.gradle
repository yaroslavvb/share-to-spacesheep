plugins {
    id("com.android.application")
}

// Automatically discover the highest installed stable Android SDK platform (floor: API 37).
// Skips preview/canary platforms (PreviewSdkInt > 0) which Google Play Console rejects.
def resolveLatestStableSdk = { int minFloor ->
    if (project.hasProperty("targetSdkOverride")) {
        return project.property("targetSdkOverride").toString().toInteger()
    }
    int highest = minFloor
    try {
        def sdkDir = null
        def localPropsFile = rootProject.file("local.properties")
        if (localPropsFile.exists()) {
            def props = new Properties()
            localPropsFile.withInputStream { props.load(it) }
            if (props.getProperty("sdk.dir")) {
                sdkDir = new File(props.getProperty("sdk.dir"))
            }
        }
        if (sdkDir == null || !sdkDir.exists()) {
            def envSdk = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT") ?: "${System.getProperty('user.home')}/Library/Android/sdk"
            sdkDir = new File(envSdk)
        }
        def platformsDir = new File(sdkDir, "platforms")
        if (platformsDir.exists()) {
            platformsDir.eachDir { dir ->
                def sourceProps = new File(dir, "source.properties")
                if (sourceProps.exists()) {
                    def p = new Properties()
                    sourceProps.withInputStream { p.load(it) }
                    def previewInt = (p.getProperty("AndroidVersion.PreviewSdkInt") ?: "0").trim()
                    def isPreview = previewInt != "0" && previewInt != ""
                    def apiStr = (p.getProperty("AndroidVersion.ApiLevel") ?: "").trim()
                    if (!isPreview && apiStr.matches("\\d+(\\.\\d+)?")) {
                        int apiMajor = apiStr.tokenize('.')[0].toInteger()
                        if (apiMajor > highest) {
                            highest = apiMajor
                        }
                    }
                }
            }
        }
    } catch (Exception ignored) {
    }
    return highest
}

def resolveMonotonicVersionCode = { int minCode ->
    if (project.hasProperty("versionCodeOverride")) {
        return project.property("versionCodeOverride").toString().toInteger()
    }
    try {
        def proc = ["git", "rev-list", "--count", "HEAD"].execute(null, rootProject.projectDir)
        proc.waitFor()
        if (proc.exitValue() == 0) {
            int commits = proc.in.text.trim().toInteger()
            // Anchor so commit #20 = versionCode 9, and every subsequent commit increments monotonically.
            return Math.max(minCode, commits - 11)
        }
    } catch (Exception ignored) {
    }
    return minCode
}

def latestStableSdk = resolveLatestStableSdk(37)
def autoVersionCode = resolveMonotonicVersionCode(34)
def isReleaseTask = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
def includeSeedKey = project.hasProperty("seedKey") && project.property("seedKey").toString().toBoolean()

android {
    namespace = "dev.spacesheep.share"
    compileSdk = latestStableSdk

    defaultConfig {
        applicationId = "com.yaroslavvb.sheepit"
        minSdk = 26
        targetSdk = latestStableSdk
        versionCode = autoVersionCode
        versionName = "0.6.3"
    }

    androidResources {
        // Never bundle local developer default_key.txt into Play Store release artifacts
        // unless explicitly requested via -PseedKey=true for local device installation.
        if (isReleaseTask && !includeSeedKey) {
            ignoreAssetsPatterns.add("default_key.txt")
        }
    }

    signingConfigs {
        release {
            def ksFile = file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "${System.getProperty('user.home')}/.config/spacesheep/android-release.jks")
            if (ksFile.exists()) {
                storeFile = ksFile
                storePassword = System.getenv("ANDROID_KEYSTORE_PASS") ?: "spacesheep2026"
                keyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: "spacesheep"
                keyPassword = System.getenv("ANDROID_KEY_PASS") ?: "spacesheep2026"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            def ksFile = file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "${System.getProperty('user.home')}/.config/spacesheep/android-release.jks")
            if (ksFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

tasks.matching { it.name == "bundleRelease" }.configureEach {
    doLast {
        def aabFile = file("${buildDir}/outputs/bundle/release/app-release.aab")
        if (aabFile.exists()) {
            def playStoreDir = rootProject.file("play-store")
            playStoreDir.mkdirs()
            def vName = android.defaultConfig.versionName
            copy {
                from aabFile
                into playStoreDir
                rename { "sheepit-v${vName}.aab" }
            }
            copy {
                from aabFile
                into playStoreDir
                rename { "sheepit-latest.aab" }
            }
            logger.lifecycle("Synced signed Play Store bundle (API ${latestStableSdk}, versionCode ${android.defaultConfig.versionCode}) -> play-store/sheepit-v${vName}.aab & play-store/sheepit-latest.aab")
        }
    }
}

tasks.matching { it.name == "assembleRelease" }.configureEach {
    doLast {
        def apkFile = file("${buildDir}/outputs/apk/release/app-release.apk")
        if (apkFile.exists() && !includeSeedKey) {
            def playStoreDir = rootProject.file("play-store")
            playStoreDir.mkdirs()
            def vName = android.defaultConfig.versionName
            copy {
                from apkFile
                into playStoreDir
                rename { "sheepit-v${vName}.apk" }
            }
            copy {
                from apkFile
                into playStoreDir
                rename { "sheepit-latest.apk" }
            }
            logger.lifecycle("Synced signed release APK (API ${latestStableSdk}, versionCode ${android.defaultConfig.versionCode}) -> play-store/sheepit-v${vName}.apk & play-store/sheepit-latest.apk")
        }
    }
}

tasks.register("publishPlayStore", Exec) {
    group = "publishing"
    description = "Bumps versionCode, builds signed release AAB, and uploads to Google Play Store (default: internal track)."
    workingDir = rootProject.projectDir
    commandLine "python3", "${rootProject.projectDir}/scripts/release-playstore.py", "--bump"
}

dependencies {
}
